name: Telegram wizard tests
on:
  push:
    branches: [feat/telegram-multichannel-wizard]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/multi.test.js
