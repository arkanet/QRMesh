name: Community discovery nightly
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: community-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/discovery/*.test.js
      - name: Scan public sources and update catalog
        run: node scripts/discovery/nightly.js
      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/discovery-report.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(discovery): refresh verified community channels"
            git push
          fi
