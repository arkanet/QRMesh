name: Community discovery tests
on:
  push:
    branches: [feat/community-discovery-lora-profiles]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/discovery/*.test.js
      - run: node --check scripts/discovery/nightly.js
      - run: node --check scripts/discovery/scanner.js
      - run: node --check scripts/discovery/source-review.js
      - run: node --check scripts/discovery/audit-gate.js
      - run: node --check scripts/discovery/audit.js
      - run: node --check scripts/discovery/meshtastic-link.js
  live-audit:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real-source scan in isolated workspace
        run: |
          node scripts/discovery/audit.js
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-discovery-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14

  prepublish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect regional selectors and source scripts
        run: node scripts/discovery/inspect-regions.js
      - name: Verify real source import and idempotent reimport
        run: node scripts/discovery/prepublish-check.js
      - name: Save prepublication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepublish-check
          path: audit-output/prepublish.json
          if-no-files-found: warn
          retention-days: 14

  import-once:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(discovery):')
    needs: [test, prepublish, live-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute actual nightly importer now
        run: node scripts/discovery/nightly.js
      - name: Commit catalog to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/discovery-report.json data/discovery-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(discovery): immediate verified import test"
            git push
          fi
